<title>Tienda en línea</title>
<style>
:root{--g:#1E6B47;--gd:#10402a;--cream:#FFF2D2;--sun:#FFC83D;--tom:#E8452C;--ink:#1c1b16;--paper:#fffdf5;--mute:#6b6759;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--cream);color:var(--ink);font-family:ui-rounded,"SF Pro Rounded","Nunito","Arial Rounded MT Bold",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.35;padding-bottom:96px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}
/* cabecera */
header{background:var(--g);color:var(--cream);border-bottom:2px solid var(--ink);position:sticky;top:0;z-index:20}
.hin{max-width:760px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:10px;justify-content:space-between}
.brand{display:flex;flex-direction:column;line-height:1}
.brand small{font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.85;font-weight:700}
.brand b{font-size:26px;font-weight:900;letter-spacing:-.02em}
.sw{display:flex;align-items:center;gap:8px;background:var(--cream);color:var(--ink);border:1.5px solid var(--ink);border-radius:999px;padding:5px 12px 5px 6px;font-weight:800;font-size:14px;box-shadow:1px 1px 0 var(--ink)}
.sw i{width:34px;height:20px;border-radius:999px;background:#c9c3ad;border:1.5px solid var(--ink);position:relative;transition:.15s}
.sw i::after{content:"";position:absolute;top:1px;left:1px;width:14px;height:14px;border-radius:50%;background:var(--ink);transition:.15s}
.sw.on i{background:var(--sun)}.sw.on i::after{left:15px}
/* franja */
.band{background:var(--sun);border:1.5px solid var(--ink);border-radius:14px;transform:rotate(-1.2deg);margin:16px 0 14px;padding:10px 14px;text-align:center;font-weight:900;letter-spacing:.02em;box-shadow:1px 1px 0 var(--ink)}
.band small{display:block;font-weight:700;font-size:13px;letter-spacing:0;margin-top:2px}
.note{background:var(--paper);border:1px dashed var(--ink);border-radius:12px;padding:8px 12px;font-size:14px;margin:0 0 12px}
/* buscador y categorías */
.search{width:100%;border:1.5px solid var(--ink);border-radius:14px;background:var(--paper);padding:12px 14px;box-shadow:1px 1px 0 var(--ink);outline:none}
.search:focus{background:#fff;box-shadow:1px 1px 0 var(--g)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--ink);background:var(--paper);border-radius:999px;padding:6px 14px;font-weight:800;font-size:14px}
.chip.on{background:var(--tom);color:#fff}
/* productos con foto */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:10px 2px 6px}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--paper);border:1.5px solid var(--ink);border-radius:var(--r);box-shadow:1px 1px 0 var(--ink);overflow:hidden;display:flex;flex-direction:column;position:relative}
.ph{aspect-ratio:1/1;background:var(--c,#cfe3d6);display:flex;align-items:center;justify-content:center;border-bottom:1.5px solid var(--ink);position:relative;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .ini{font-size:54px;font-weight:900;color:rgba(28,27,22,.55)}
.sticker{position:absolute;right:8px;bottom:8px;background:var(--sun);border:1.5px solid var(--ink);border-radius:999px;padding:2px 10px;font-weight:900;font-size:16px;transform:rotate(-4deg);box-shadow:1px 1px 0 var(--ink)}
.low{position:absolute;left:8px;top:8px;background:var(--tom);color:#fff;border:1.5px solid var(--ink);border-radius:8px;padding:1px 8px;font-size:12px;font-weight:800}
.cb{padding:10px 10px 12px;display:flex;flex-direction:column;gap:8px;flex:1}
.nm{font-weight:800;font-size:15px;line-height:1.15;min-height:35px}
.bt{border:1.5px solid var(--ink);background:var(--g);color:#fff;border-radius:12px;font-weight:900;padding:9px 10px;min-height:44px;box-shadow:1px 1px 0 var(--ink);transition:.08s;width:100%}
.bt:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
.bt.alt{background:var(--paper);color:var(--ink)}
.bt.big{font-size:18px;padding:13px}
.bt.wa{background:#25D366;color:#06210f}
.bt[disabled]{opacity:.55}
/* stepper */
.st{display:flex;align-items:center;justify-content:space-between;border:1.5px solid var(--ink);border-radius:12px;background:var(--sun);overflow:hidden;min-height:44px}
.st button{border:0;background:transparent;width:40px;height:44px;font-size:24px;font-weight:900}
.st button:active{background:rgba(0,0,0,.12)}
.st b{font-size:15px;font-weight:900;white-space:nowrap}
/* modo ligero */
.list{display:flex;flex-direction:column;gap:10px;padding:10px 2px 6px}
.row{background:var(--paper);border:1.5px solid var(--ink);border-radius:14px;box-shadow:1px 1px 0 var(--ink);padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:8px 10px;align-items:center}
.row .nm{min-height:0;font-size:16px}
.row .pr{font-weight:900;background:var(--sun);border:1.5px solid var(--ink);border-radius:999px;padding:0 9px;font-size:14px;white-space:nowrap;display:inline-block;margin-top:3px}
.row .ctl{width:150px}
.cat{font-weight:900;font-size:13px;letter-spacing:.12em;text-transform:uppercase;margin:16px 4px 2px;color:var(--gd)}
/* barra del carrito */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 14px calc(10px + env(safe-area-inset-bottom));pointer-events:none}
.bar button{pointer-events:auto;display:flex;justify-content:space-between;align-items:center;width:100%;max-width:760px;margin:0 auto;background:var(--tom);color:#fff;border:1.5px solid var(--ink);border-radius:16px;padding:14px 16px;font-weight:900;font-size:17px;box-shadow:1px 1px 0 var(--ink)}
.bar button span.n{background:var(--cream);color:var(--ink);border:1.5px solid var(--ink);border-radius:999px;min-width:28px;text-align:center;padding:0 8px;margin-right:8px}
/* hoja del pedido */
.sheet{position:fixed;inset:0;z-index:50;background:var(--cream);overflow-y:auto;display:none}
.sheet.open{display:block}
.sh{max-width:620px;margin:0 auto;padding:0 14px 40px}
.sh h2{font-size:26px;font-weight:900;margin:16px 0 4px;letter-spacing:-.02em}
.x{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;background:var(--cream);padding:12px 0 6px;z-index:2}
.x button.back{border:1.5px solid var(--ink);background:var(--paper);border-radius:12px;font-weight:900;padding:8px 14px;box-shadow:1px 1px 0 var(--ink)}
.li{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;background:var(--paper);border:1.5px solid var(--ink);border-radius:14px;padding:10px 12px;margin:10px 0}
.li .ctl{width:150px}.li s{display:none}
.li small{color:var(--mute);font-weight:700}
.tot{display:flex;justify-content:space-between;font-size:22px;font-weight:900;margin:14px 2px}
.f{display:block;margin:12px 0 0;font-weight:800;font-size:14px}
.f input,.f textarea{display:block;width:100%;margin-top:5px;border:1.5px solid var(--ink);border-radius:12px;padding:12px;background:var(--paper);outline:none;font-weight:600}
.f input:focus,.f textarea:focus{background:#fff;box-shadow:1px 1px 0 var(--g)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.seg button{border:1.5px solid var(--ink);background:var(--paper);border-radius:14px;padding:12px 8px;font-weight:900;line-height:1.15}
.seg button small{display:block;font-weight:700;opacity:.8}
.seg button.on{background:var(--sun);box-shadow:1px 1px 0 var(--ink)}
.err{background:#ffe0d8;border:1.5px solid var(--tom);border-radius:12px;padding:10px 12px;margin-top:12px;font-weight:800}
.help{color:var(--mute);font-size:13px;margin:8px 2px}
.empty{text-align:center;padding:40px 10px}
.empty h3{font-size:22px;margin:8px 0}
/* éxito */
.ok{text-align:center;padding-top:26px}
.code{display:inline-block;background:var(--sun);border:1.5px solid var(--ink);border-radius:18px;padding:6px 22px;font-size:44px;font-weight:900;letter-spacing:.12em;transform:rotate(-2deg);box-shadow:5px 5px 0 var(--ink);margin:10px 0 6px}
.sum{text-align:left;background:var(--paper);border:1.5px solid var(--ink);border-radius:14px;padding:12px 14px;margin:16px 0}
.sum div{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.steps{text-align:left;margin:6px 4px 16px;padding-left:20px;font-weight:700}
.steps li{margin:6px 0}
.sk{height:210px;border:1.5px solid var(--ink);border-radius:var(--r);background:linear-gradient(90deg,#fff7df,#f3e6bd,#fff7df);background-size:200% 100%;animation:sk 1.2s infinite linear}
@keyframes sk{to{background-position:-200% 0}}
.top{display:none}
.pk{border-top:1px dashed var(--ink);padding-top:8px;display:flex;flex-direction:column;gap:6px}.pkh{display:flex;justify-content:space-between;gap:6px;font-size:14px}.pkh span{font-weight:900}
.pks{grid-column:1/-1;display:flex;flex-direction:column;gap:8px}.pks .pk{flex-direction:row;align-items:center;justify-content:space-between}.pks .pkh{flex-direction:column;gap:0}.pks .st,.pks .bt{width:150px;flex:none}
footer{text-align:center;color:var(--mute);font-size:12px;margin:26px 0 0}
.logo{display:flex;align-items:center;gap:9px}.logo .mk{width:38px;height:38px}.logo .wm{height:24px;width:auto}
.loc{text-align:center;font-size:13.5px;font-weight:700;color:var(--gd);margin:-4px 0 12px;line-height:1.5}
</style>
</head>

<script>
(function(){
'use strict';
var SB={url:'https://kxrdtpmxfjqyolodyznh.supabase.co',key:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt4cmR0cG14ZmpxeW9sb2R5em5oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ3OTgzMjMsImV4cCI6MjExMDM3NDMyM30.oALdhkcF3wgWZ_yBnDuB7AhbUg4VxFBj5EqHtqjXit0'};
var K={cart:'tienda.cart',cust:'tienda.cust',ph:'tienda.fotos',cat:'tienda.catalogo'};
var info={name:'Tienda',open:false,wa:'',note:'',hold:24},items=[],cart={},cust={name:'',phone:'',mode:'recoger',addr:'',note:''},ui={q:'',cat:'',photos:true,auto:false,loaded:false,offline:false,sheet:false,busy:false,err:'',done:null};
function $(s){return document.querySelector(s);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function ls(k,v){try{if(v===undefined){var r=localStorage.getItem(k);return r?JSON.parse(r):null;}localStorage.setItem(k,JSON.stringify(v));}catch(e){return null;}}
function money(n){n=Math.round(n*100)/100;return '$'+n.toLocaleString('es',{maximumFractionDigits:2});}
function ul(it){return it&&it.ul==='lb'?'lb':'kg';}
function qtyTxt(it,q){return it.unit==='kg'?(Math.round(q*100)/100).toString().replace('.',',')+' '+ul(it):String(q);}
function step(it){return it.unit==='kg'?0.25:1;}
function lineTotal(it,q){var t=it.price*q;if(it.unit!=='kg')return Math.round(t*100)/100;var r=+info.round||0;if(r<=0)return Math.round(t*100)/100;if(t<50&&r>1)r=1;return Math.ceil(t/r-1e-9)*r;}
function byId(id){
  var m=String(id).split('#'),b=null;
  for(var i=0;i<items.length;i++)if(items[i].id===m[0]){b=items[i];break;}
  if(!b||m.length<2)return b;
  var pk=null;(b.packs||[]).forEach(function(k){if(String(k.i)===m[1])pk=k;});
  if(!pk)return null;
  return {id:id,pid:b.id,name:b.name+' ('+pk.name+' ×'+pk.n+')',price:pk.price,unit:'u',avail:Math.floor(b.avail/pk.n),n:pk.n,ph:b.ph,cat:b.cat};
}
function maxFor(key){
  var it=byId(key);if(!it)return 0;var pid=it.pid||it.id,real=byId(pid);if(!real)return 0;var other=0;
  Object.keys(cart).forEach(function(k){if(k===key)return;var o=byId(k);if(o&&(o.pid||o.id)===pid)other+=cart[k]*(o.n||1);});
  var n=it.n||1,v=(real.avail-other)/n;
  return Math.max(0,n>1?Math.floor(v+1e-9):Math.floor(v*100+1e-9)/100);
}
function itemTxt(l){return l.pk?(l.pc||Math.round(l.qty/l.pk))+' × '+l.name+' ('+(l.pname||'Paquete')+' de '+l.pk+')':qtyTxt(Object.assign({},l,{ul:(byId(l.pid)||{}).ul}),l.qty)+' × '+l.name;}
function waNum(p){var d=String(p||'').replace(/\D/g,'');if(d.length===8&&d[0]==='5')d='53'+d;return d;}
function img(it,big){return SB.url+'/storage/v1/object/public/fotos/'+(big?'p':'t')+'/'+encodeURIComponent(it.id)+'.jpg?v='+it.ph;}
var COLORS=['#cfe3d6','#ffd9c2','#fbe6a2','#d7d3f3','#c8e6f5','#f6cfd8'];
function colorOf(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return COLORS[Math.abs(h)%COLORS.length];}
/* ---------- datos ---------- */
function rpc(name,body){
  return fetch(SB.url+'/rest/v1/rpc/'+name,{method:'POST',headers:{'apikey':SB.key,'Authorization':'Bearer '+SB.key,'Content-Type':'application/json'},body:JSON.stringify(body||{})}).then(function(r){
    if(!r.ok)throw new Error('http '+r.status);return r.json();});
}
function load(){
  return Promise.all([rpc('shop_info'),rpc('catalog')]).then(function(a){
    info=Object.assign(info,a[0]||{});items=a[1]||[];ui.offline=false;ui.loaded=true;ls(K.cat,{info:info,items:items,t:Date.now()});fixCart();draw();
  }).catch(function(){
    var c=ls(K.cat);if(c&&!ui.loaded){info=c.info;items=c.items;ui.loaded=true;}
    ui.offline=true;ui.loaded=true;fixCart();draw();
  });
}
function fixCart(){
  var ch=false;Object.keys(cart).forEach(function(id){var it=byId(id);if(!it||cart[id]<=0){delete cart[id];ch=true;return;}var mx=maxFor(id);if(mx<=0){delete cart[id];ch=true;}else if(cart[id]>mx){cart[id]=mx;ch=true;}});
  if(ch)ls(K.cart,cart);
}
/* ---------- carrito ---------- */
function count(){return Object.keys(cart).length;}
function total(){var t=0;Object.keys(cart).forEach(function(id){var it=byId(id);if(it)t+=lineTotal(it,cart[id]);});return t;}
function setQ(id,q){var it=byId(id);if(!it)return;q=Math.round(q*100)/100;if(q>0){var mx=maxFor(id);if(q>mx)q=mx;}if(q<=0){delete cart[id];}else{cart[id]=q;}ls(K.cart,cart);}
function ctl(it){
  var q=cart[it.id];
  if(!q)return '<button class="bt" data-a="add" data-id="'+esc(it.id)+'" type="button">Agregar'+(it.unit==='kg'?' (0,5 '+ul(it)+')':'')+'</button>';
  return '<div class="st"><button data-a="dec" data-id="'+esc(it.id)+'" type="button" aria-label="Quitar">−</button><b>'+qtyTxt(it,q)+'</b><button data-a="inc" data-id="'+esc(it.id)+'" type="button" aria-label="Agregar uno más">+</button></div>';
}
function packRows(it){return (it.packs||[]).map(function(k){var v=byId(it.id+'#'+k.i);if(!v||(v.avail<1&&!cart[v.id]))return '';return '<div class="pk"><div class="pkh"><b>'+esc(k.name)+' ×'+k.n+'</b><span>'+money(k.price)+'</span></div>'+ctl(v)+'</div>';}).join('');}
function priceTxt(it){return money(it.price)+(it.unit==='kg'?' /'+ul(it):'');}
/* ---------- vistas ---------- */
function cats(){var m={},o=[];items.forEach(function(it){if(!m[it.cat]){m[it.cat]=1;o.push(it.cat);}});return o;}
function visible(){var q=ui.q.trim().toLowerCase();return items.filter(function(it){return (!ui.cat||it.cat===ui.cat)&&(!q||it.name.toLowerCase().indexOf(q)>=0);});}
function card(it){
  var low=it.avail<=3&&it.unit!=='kg';
  var pic=(ui.photos&&it.ph)?'<img src="'+esc(img(it))+'" alt="" loading="lazy" decoding="async" onerror="this.parentNode.classList.add(\'noimg\');this.remove()">':'';
  return '<article class="card" data-id="'+esc(it.id)+'"><div class="ph" style="--c:'+colorOf(it.name)+'">'+(pic||'<span class="ini">'+esc(it.name.charAt(0).toUpperCase())+'</span>')+'<span class="sticker">'+priceTxt(it)+'</span>'+(low?'<span class="low">Quedan '+it.avail+'</span>':'')+'</div><div class="cb"><div class="nm">'+esc(it.name)+'</div>'+ctl(it)+packRows(it)+'</div></article>';
}
function rowOf(it){
  var low=it.avail<=3&&it.unit!=='kg';
  return '<div class="row"><div><div class="nm">'+esc(it.name)+'</div><span class="pr">'+priceTxt(it)+'</span>'+(low?' <small style="color:var(--tom);font-weight:800">Quedan '+it.avail+'</small>':'')+'</div><div class="ctl">'+ctl(it)+'</div>'+(packRows(it)?'<div class="pks">'+packRows(it)+'</div>':'')+'</div>';
}
function draw(){
  $('#shop').textContent=info.name||'Tienda';document.title=(info.name||'Tienda')+' · Tienda en línea';
  var sw=$('#sw');sw.classList.toggle('on',ui.photos);sw.setAttribute('aria-pressed',ui.photos?'true':'false');$('#swt').textContent=ui.photos?'Fotos':'Sin fotos';
  var h='';
  if(!ui.loaded){$('#app').innerHTML='<div class="band">Cargando…</div><div class="grid"><div class="sk"></div><div class="sk"></div></div>';return;}
  if(!info.open&&!ui.offline){$('#app').innerHTML='<div class="empty"><div style="font-size:54px">🌙</div><h3>La tienda está cerrada por ahora</h3><p class="help">Vuelve más tarde. Si necesitas algo, escríbenos por WhatsApp.</p>'+(info.wa?'<a class="bt wa big" style="display:block;text-decoration:none;text-align:center" href="https://wa.me/'+esc(waNum(info.wa))+'">Escribir por WhatsApp</a>':'')+'</div>';$('#bar').style.display='none';return;}
  h+='<div class="band">PIDE AQUÍ · RECOGE O TE LO LLEVAMOS<small>Tu pedido queda reservado y lo confirmamos por WhatsApp</small></div><div class="loc">Contreras esq. Mujica · Matanzas<br>Todos los días 9am–6pm</div>';
  if(ui.offline)h+='<div class="note">Sin conexión: te mostramos la última lista guardada. Puede haber cambios.</div>';
  if(ui.auto&&ui.photos===false)h+='<div class="note">Activamos el modo sin fotos porque tu conexión es lenta. Puedes volver a ponerlas arriba.</div>';
  if(info.note)h+='<div class="note">'+esc(info.note)+'</div>';
  h+='<input class="search" id="q" type="search" placeholder="Buscar producto…" value="'+esc(ui.q)+'" autocomplete="off">';
  var cs=cats();
  if(cs.length>1)h+='<div class="chips"><button class="chip'+(ui.cat?'':' on')+'" data-a="cat" data-c="" type="button">Todo</button>'+cs.map(function(c){return '<button class="chip'+(ui.cat===c?' on':'')+'" data-a="cat" data-c="'+esc(c)+'" type="button">'+esc(c)+'</button>';}).join('')+'</div>';
  var v=visible();
  if(!items.length)h+='<div class="empty"><div style="font-size:54px">🛒</div><h3>Por ahora no hay productos disponibles</h3><p class="help">Vuelve en un rato.</p></div>';
  else if(!v.length)h+='<div class="empty"><h3>No encontramos ese producto</h3></div>';
  else if(ui.photos)h+='<div class="grid">'+v.map(card).join('')+'</div>';
  else{var last='';h+='<div class="list">';v.forEach(function(it){if(it.cat!==last&&!ui.cat&&cs.length>1){h+='</div><div class="cat">'+esc(it.cat)+'</div><div class="list">';last=it.cat;}h+=rowOf(it);});h+='</div>';}
  h+='<footer>'+esc(info.name||'')+' · Tienda en línea</footer>';
  var keep=document.activeElement&&document.activeElement.id==='q',pos=keep?document.activeElement.selectionStart:0;
  $('#app').innerHTML=h;
  if(keep){var qi=$('#q');qi.focus();try{qi.setSelectionRange(pos,pos);}catch(e){}}
  bar();if(ui.sheet)sheet();
}
function bar(){
  var n=count(),b=$('#bar');b.style.display=(n&&!ui.sheet&&info.open)?'block':'none';
  $('#bn').textContent=n;$('#bt').textContent=money(total());
}
function sheet(){
  var s=$('#sheet');s.classList.toggle('open',ui.sheet);document.body.style.overflow=ui.sheet?'hidden':'';
  if(!ui.sheet){bar();return;}
  var h='<div class="sh"><div class="x"><button class="back" data-a="close" type="button">‹ Seguir comprando</button></div>';
  if(ui.done){var d=ui.done;
    h+='<div class="ok"><div style="font-size:54px">🎉</div><h2>¡Pedido recibido!</h2><p class="help" style="font-size:15px">Tu código:</p><div class="code">'+esc(d.code)+'</div>'+
    '<div class="sum">'+d.items.map(function(l){return '<div><span>'+esc(itemTxt(l))+'</span><b>'+money(l.sub)+'</b></div>';}).join('')+'<div style="border-top:2px solid var(--ink);margin-top:6px;padding-top:8px;font-size:20px"><b>Total</b><b>'+money(d.total)+'</b></div></div>'+
    '<ol class="steps"><li>Toca el botón verde para enviarnos tu pedido por WhatsApp.</li><li>Te confirmamos la disponibilidad y '+(d.mode==='domicilio'?'el costo del domicilio':'cuándo puedes recoger')+'.</li><li>Pagas al '+(d.mode==='domicilio'?'recibirlo':'recogerlo')+' (efectivo o transferencia).</li></ol>'+
    (info.wa?'<a class="bt wa big" style="display:block;text-decoration:none;text-align:center" id="wa" href="'+esc(waLink(d))+'" target="_blank" rel="noopener">Enviar mi pedido por WhatsApp</a>':'')+
    '<p class="help">Tu pedido queda reservado por '+Math.round(info.hold||24)+' horas.</p><button class="bt alt" style="margin-top:8px" data-a="again" type="button">Hacer otro pedido</button></div></div>';
    s.innerHTML=h;return;}
  var ids=Object.keys(cart);
  if(!ids.length){h+='<div class="empty"><div style="font-size:54px">🛒</div><h3>Tu pedido está vacío</h3><button class="bt" data-a="close" type="button">Ver productos</button></div></div>';s.innerHTML=h;return;}
  h+='<h2>Mi pedido</h2>';
  ids.forEach(function(id){var it=byId(id);if(!it)return;h+='<div class="li"><div><b>'+esc(it.name)+'</b><br><small>'+priceTxt(it)+' · '+money(lineTotal(it,cart[id]))+'</small></div><div class="ctl">'+ctl(it)+'</div></div>';});
  h+='<div class="tot"><span>Total</span><span>'+money(total())+'</span></div>';
  h+='<div class="seg"><button data-a="mode" data-m="recoger" class="'+(cust.mode==='recoger'?'on':'')+'" type="button">🏪 Recoger<small>en el mercado</small></button><button data-a="mode" data-m="domicilio" class="'+(cust.mode==='domicilio'?'on':'')+'" type="button">🛵 Domicilio<small>te lo llevamos</small></button></div>';
  h+='<label class="f">Tu nombre<input id="c-name" autocomplete="name" value="'+esc(cust.name)+'" maxlength="60"></label>';
  h+='<label class="f">Tu WhatsApp<input id="c-phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="Ej: 5 123 4567" value="'+esc(cust.phone)+'" maxlength="20"></label>';
  if(cust.mode==='domicilio')h+='<label class="f">Dirección<textarea id="c-addr" rows="2" maxlength="200" placeholder="Calle, número, entre calles, reparto">'+esc(cust.addr)+'</textarea></label><p class="help">El costo del domicilio te lo confirmamos por WhatsApp.</p>';
  h+='<label class="f">Nota (opcional)<textarea id="c-note" rows="2" maxlength="300" placeholder="Algo que debamos saber">'+esc(cust.note)+'</textarea></label>';
  if(ui.err)h+='<div class="err">'+esc(ui.err)+'</div>';
  h+='<button class="bt big" style="margin-top:16px" data-a="send" type="button"'+(ui.busy?' disabled':'')+'>'+(ui.busy?'Enviando…':'Hacer pedido')+'</button><p class="help">Pagas al '+(cust.mode==='domicilio'?'recibir':'recoger')+'. No cobramos nada por la página.</p></div>';
  s.innerHTML=h;
}
function waLink(d){
  var L=['*Pedido '+d.code+'* — '+(info.name||'Tienda'),'Cliente: '+d.name+' (+'+waNum(d.phone).replace(/^(53)/,'$1 ')+')',d.mode==='domicilio'?'🛵 Domicilio: '+d.addr:'🏪 Recoge en el mercado',''];
  d.items.forEach(function(l){L.push('• '+itemTxt(l)+' — '+money(l.sub));});
  L.push('','*Total: '+money(d.total)+'*');if(d.note)L.push('Nota: '+d.note);
  return 'https://wa.me/'+waNum(info.wa)+'?text='+encodeURIComponent(L.join('\n'));
}
function collect(){var g=function(id){var e=$('#'+id);return e?e.value:null;};
  if(g('c-name')!==null)cust.name=g('c-name');if(g('c-phone')!==null)cust.phone=g('c-phone');if(g('c-addr')!==null)cust.addr=g('c-addr');if(g('c-note')!==null)cust.note=g('c-note');ls(K.cust,cust);}
function send(){
  collect();ui.err='';
  if(ui.busy)return;
  if(cust.name.trim().length<2)ui.err='Escribe tu nombre.';
  else if(String(cust.phone).replace(/\D/g,'').length<7)ui.err='Escribe tu número de WhatsApp para confirmarte el pedido.';
  else if(cust.mode==='domicilio'&&cust.addr.trim().length<5)ui.err='Escribe tu dirección para el domicilio.';
  if(ui.err){sheet();return;}
  ui.busy=true;sheet();
  var ph=cust.phone,lines=Object.keys(cart).map(function(id){var m=id.split('#');return m.length>1?{pid:m[0],pk:+m[1],qty:cart[id]}:{pid:id,qty:cart[id]};});
  rpc('place_order',{p_name:cust.name.trim(),p_phone:cust.phone,p_mode:cust.mode,p_addr:cust.addr.trim(),p_note:cust.note.trim(),p_items:lines}).then(function(r){
    ui.busy=false;
    if(r&&r.ok){ui.done={code:r.code,total:r.total,items:r.items,name:cust.name.trim(),phone:ph.replace(/\D/g,''),mode:cust.mode,addr:cust.mode==='domicilio'?cust.addr.trim():'',note:cust.note.trim()};cart={};ls(K.cart,cart);cust.note='';ls(K.cust,cust);sheet();load();}
    else{ui.err=(r&&r.msg)||'No se pudo enviar el pedido. Intenta otra vez.';sheet();if(r&&(r.err==='stock'||r.err==='producto'))load();}
  }).catch(function(){ui.busy=false;ui.err='No hay conexión. Revisa tu internet e intenta otra vez; tu pedido no se perdió.';sheet();});
}
/* ---------- eventos ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-a]');
  if(!t){if(e.target.closest('#sw')){ui.photos=!ui.photos;ui.auto=false;ls(K.ph,ui.photos?1:0);draw();}else if(e.target.closest('#open')){ui.sheet=true;ui.done=null;ui.err='';sheet();}return;}
  var a=t.dataset.a,id=t.dataset.id,it=id?byId(id):null;
  if(a==='add'&&it){setQ(id,it.unit==='kg'?0.5:1);}
  else if(a==='inc'&&it){setQ(id,(cart[id]||0)+step(it));}
  else if(a==='dec'&&it){setQ(id,(cart[id]||0)-step(it));}
  else if(a==='cat'){ui.cat=t.dataset.c;}
  else if(a==='close'){ui.sheet=false;ui.done=null;}
  else if(a==='again'){ui.sheet=false;ui.done=null;}
  else if(a==='mode'){collect();cust.mode=t.dataset.m;ls(K.cust,cust);ui.err='';}
  else if(a==='send'){send();return;}
  if(a==='close'||a==='again'){sheet();}
  if(ui.sheet&&(a==='inc'||a==='dec'||a==='add'||a==='mode'))collect();
  draw();if(ui.sheet)sheet();
});
document.addEventListener('input',function(e){
  if(e.target.id==='q'){ui.q=e.target.value;draw();}
  else if(e.target.closest&&e.target.closest('#sheet'))collect();
});
document.addEventListener('visibilitychange',function(){if(!document.hidden)load();});
setInterval(function(){if(!document.hidden&&!ui.sheet)load();},60000);
/* ---------- inicio ---------- */
(function init(){
  cart=ls(K.cart)||{};var c=ls(K.cust);if(c)cust=Object.assign(cust,c);
  var pref=ls(K.ph);
  if(pref===0||pref===1)ui.photos=pref===1;
  else{var cn=navigator.connection||navigator.mozConnection||{};if(cn.saveData||/(^|-)2g$/.test(cn.effectiveType||'')){ui.photos=false;ui.auto=true;}}
  draw();load();
})();
})();
</script>
</body>
</html>
