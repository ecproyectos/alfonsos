<title>Alfonsos · Caja e Inventario</title>
<style>
:root{--bg:#f5f3ec;--card:#fff;--ink:#17261e;--muted:#6a7870;--line:#e3dfd2;--brand:#1c7a4c;--brand2:#e6f2ea;--warn:#a85a07;--warnbg:#fdf0dc;--bad:#b42318;--badbg:#fde7e4;--navh:60px}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:max(10px,env(safe-area-inset-top)) 14px 8px;border-bottom:1px solid var(--line)}
.hin{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#biz{font-weight:700;font-size:17px;flex:1;min-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.chip.ok{color:var(--brand)}.chip.warn{color:var(--warn);background:var(--warnbg)}.chip.bad{color:var(--bad);background:var(--badbg)}
main{padding:12px 14px calc(var(--navh) + 90px);max-width:820px;margin:0 auto}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted);cursor:pointer}
nav button.on{color:var(--brand);font-weight:600}
.hin{display:block}.hrow1{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:6px}.hrow1 #logo{min-width:0;flex:none;justify-self:start}.hrow1 #logo .wm{height:20px}#rate-chip{justify-self:center}.hrow1 #logo .mk{width:34px;height:34px}.hrow1 .chip{font-size:12px;padding:5px 9px}.hrow1 #rate-chip{padding:5px 8px;font-size:11.5px}#sync-chip{justify-self:end}.hrow2{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px}.hrow2 .chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px}.hrow2 #out-btn{margin-left:auto}.chip.gear{}.chip.gear.on{background:var(--mango)!important;color:#1B2A22!important}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#cartbar{position:fixed;left:0;right:0;bottom:calc(var(--navh) + env(safe-area-inset-bottom));z-index:6;padding:0 14px 10px;display:none}
#cartbar .cbw{max-width:792px;margin:0 auto;display:flex;gap:8px}
#cartbar button{display:flex;align-items:center;border:0;border-radius:16px;font-weight:600;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.2)}
#cartbar .cb-main{flex:1;justify-content:space-between;background:var(--brand);color:#fff;padding:16px 18px;font-size:18px}
#cartbar .cb-undo{background:var(--card);color:var(--ink);border:1px solid var(--line);padding:0 16px;font-size:16px;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.card h4{margin:0 0 6px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.muted{color:var(--muted)}.center{text-align:center}.cap{text-transform:capitalize;margin:2px 0 10px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:-1px}
label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:10px}
label input,label select,label textarea{margin-top:4px;color:var(--ink);font-size:15px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;cursor:pointer}
.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:600}
.btn.big{width:100%;padding:13px;font-size:16px;margin-top:4px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.btns .btn{flex:1;min-width:120px}
.bar{display:flex;gap:8px;margin-bottom:10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:4px}
.chips .chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.prod{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:78px}
.prod b{font-size:14.5px;line-height:1.2}.prod .pr{color:var(--brand);font-weight:700}.prod small{color:var(--muted)}
.prod.out{opacity:.5}
.pedbar{display:block;width:100%;text-align:left;border:1px solid var(--brand);background:color-mix(in srgb,var(--brand) 12%,var(--card));color:var(--ink);border-radius:12px;padding:10px 12px;margin:0 0 10px;font-size:15px;cursor:pointer}
.ped.new{border-color:var(--brand);border-width:2px}.sec{margin:14px 2px 6px}
.warnbox{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:8px 10px;margin:6px 0;font-size:14px}
.photobox{display:flex;gap:12px;align-items:center;margin:4px 0 8px}
.phprev{width:96px;height:96px;border-radius:12px;background:var(--bg);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--muted);font-size:13px;flex:none}.phprev img{width:100%;height:100%;object-fit:cover}.prod.low{border-color:#e3b779;background:var(--warnbg)}.prod.low small{color:var(--warn);font-weight:700}
.lowbar{display:block;width:100%;text-align:left;border:1px solid #e3b779;background:var(--warnbg);color:var(--warn);border-radius:12px;padding:10px 12px;margin:0 0 10px;font-size:14px;line-height:1.35;cursor:pointer}
nav .nd{position:absolute;top:4px;margin-left:14px;min-width:17px;height:17px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;line-height:17px;font-weight:700;padding:0 4px;text-align:center}nav button{position:relative}
.item{width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 2px;display:flex;justify-content:space-between;gap:10px;cursor:pointer}
.item small{display:block;color:var(--muted)}.item .r{text-align:right}
.row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}.row.sum{font-weight:700}.row.sub{color:var(--muted)}
.badge{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--brand2);color:var(--brand)}
.badge.low{background:var(--warnbg);color:var(--warn)}.badge.out{background:var(--badbg);color:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.kpis small{display:block;color:var(--muted);font-size:11.5px}.kpis b{font-size:17px}
.pos{color:var(--brand)}.neg{color:var(--bad)}
.daynav{display:flex;gap:8px;align-items:center;margin-bottom:4px}.daynav input{flex:1;text-align:center}
.empty{text-align:center;padding:40px 16px}.empty h3{margin:0 0 6px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:18px}}
.sheet h3{margin:0 0 12px;font-size:18px}
.mclose{float:right;margin:-4px -4px 6px 10px;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:19px;line-height:1;cursor:pointer;padding:0}
.hist button.hx{border:0;background:none;color:var(--bad);font-size:15px;padding:2px 6px;cursor:pointer}
.wtgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.wtgrid .btn{display:flex;flex-direction:column;align-items:center;gap:2px}.wtgrid .btn small{font-weight:400;color:var(--muted)}
.cl{border-bottom:1px solid var(--line);padding:8px 0}
.cl .cn{font-weight:600}.cl .cn small{color:var(--muted);font-weight:400;margin-left:6px}
.cl .cc{display:grid;grid-template-columns:auto 1fr 1fr auto;gap:6px;align-items:center;margin-top:6px}
.cl .cc button{width:36px;height:36px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:18px;cursor:pointer}

.tot{display:flex;justify-content:space-between;font-size:20px;font-weight:700;margin-top:10px}
.tot2{color:var(--muted);text-align:right;margin-bottom:10px}
.payg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:6px}
details.smsbox{margin:8px 0 4px}details.smsbox summary{cursor:pointer;font-weight:700;color:var(--brand);padding:6px 0}details.smsbox textarea{min-height:84px;font-size:15px}.smsres{margin-top:6px;font-size:13.5px;font-weight:600}.smsres.ok{color:var(--brand)}.smsres.bad{color:var(--warn)}

.paystat.ok{background:var(--brand2);color:var(--brand)}.paystat.bad{background:var(--warnbg);color:var(--warn)}
#toast{position:fixed;left:50%;bottom:calc(var(--navh) + 80px);transform:translateX(-50%);background:#17261e;color:#fff;padding:10px 16px;border-radius:12px;z-index:40;display:none;max-width:90vw;text-align:center}
.help{font-size:13px;color:var(--muted);margin:4px 0 10px}
.hist{font-size:13px;color:var(--muted);margin-top:12px}.hist div{display:flex;justify-content:space-between;padding:3px 0}
textarea{min-height:110px;font-family:ui-monospace,Menlo,monospace;font-size:13px}

  var cur=S[col][r.id];
  if(!cur||(r.u||0)>(cur.u||0)){S[col][r.id]=r;delete S.dirty[col+'/'+r.id];return true;}
  return false;
}

/* ---------- sincronización con la nube (opcional) ---------- */
function dirtyCount(){return Object.keys(S.dirty).length;}
function setSync(s){syncState=s;updateSyncChip();}
function updateSyncChip(){
  var c=$('#sync-chip');if(!c)return;
  var t,k;
  if(!DB){t='● Solo local';k='';}
  else if(!canWrite){t='● Solo lectura';k='warn';}
  else if(syncState==='error'||syncState==='slow'){t='● Sin conexión'+(dirtyCount()?' ('+dirtyCount()+')':'');k='bad';}
  else if(dirtyCount()){t='● Pendiente ('+dirtyCount()+')';k='warn';}
  else if(syncState==='ok'){t='● Sincronizado';k='ok';}
  else{t='● Conectando…';k='warn';}
  c.textContent=t;c.className='chip '+k;
}
function scheduleFlush(){if(!DB||flushTimer)return;flushTimer=setTimeout(function(){flushTimer=null;flush();},400);}
function retryLater(){if(retryTimer)return;retryTimer=setTimeout(function(){retryTimer=null;flush();},15000);}
async function flush(){
  if(!DB||flushing||!canWrite)return;
  flushing=true;var failed=false;
  try{
    var keys=Object.keys(S.dirty);
    for(var i=0;i<keys.length;i++){
      var key=keys[i],rec=recOf(key);
      if(!rec){delete S.dirty[key];continue;}
      var u=rec.u;
      try{await DB.doc(key).set(rec);}
      catch(e){
        if(e&&e.code==='denied'){delete S.dirty[key];continue;}
        if(e&&e.code==='invalid_argument'){canWrite=false;}
        else{failed=true;setSync('error');retryLater();}
        break;
      }
      var now=recOf(key);if(now&&now.u===u)delete S.dirty[key];
    }
  }finally{
    flushing=false;persist();
    if(!failed&&canWrite&&syncState==='error')syncState='ok';
    updateSyncChip();
  }
  if(!failed&&canWrite&&dirtyCount())scheduleFlush();
}
function subscribe(){
  var timer=setTimeout(function(){if(syncState!=='ok'){setSync('slow');maybeSetup();}},10000);
  COLS.forEach(function(col){
    seen[col]={};
    DB.collection(col).onSnapshot(function(snap){
      var changed=false;
      snap.docChanges().forEach(function(ch){
        if(ch.type==='removed')return;
        var r=ch.doc.data();if(!r)return;
        seen[col][ch.doc.id]=1;
        if(merge(col,r))changed=true;
      });
      if(!snap.metadata.fromCache){
        if(!synced[col]){
          synced[col]=true;
          if(col!=='config')Object.keys(S[col]).forEach(function(id){if(!seen[col][id])S.dirty[col+'/'+id]=1;});
          else if(S.settings.u>0&&!seen.config.main)S.dirty['config/main']=1;
        }
        if(COLS.every(function(c){return synced[c];})){clearTimeout(timer);if(syncState!=='ok'){syncState='ok';}scheduleFlush();maybeSetup();}
      }
      if(changed){persist();render();}
      updateSyncChip();
    },function(){setSync('error');maybeSetup();});
  });
}

/* ---------- SMS de transferencia ---------- */
var NUMRE='(\\d{1,3}(?:[.,]\\d{3})+(?:[.,]\\d{1,2})?|\\d{1,3}(?: \\d{3})+(?:[.,]\\d{1,2})?|\\d+(?:[.,]\\d{1,2})?)';
function smsNum(x){
  x=String(x).replace(/\s/g,'');
  var lc=x.lastIndexOf(','),ld=x.lastIndexOf('.');
  if(lc>-1&&ld>-1){x=lc>ld?x.replace(/\./g,'').replace(',','.'):x.replace(/,/g,'');}
  else if(lc>-1){var a=x.split(',');x=(a.length>2||a[1].length===3)?x.replace(/,/g,''):x.replace(',','.');}
  else if(ld>-1){var b=x.split('.');if(b.length>2||b[1].length===3)x=x.replace(/\./g,'');}
  var n=parseFloat(x);return isFinite(n)?n:0;
}
function smsHash(t){var h=5381,u=t.toLowerCase().replace(/\s+/g,' ').trim();for(var i=0;i<u.length;i++)h=((h<<5)+h+u.charCodeAt(i))|0;return 'SMS-'+(h>>>0).toString(16);}
function smsParse(text){
  var t=String(text||'').trim(),out={text:t,amount:0,cur:'CUP',ref:'',sent:false};
  if(!t)return out;
  var cands=[],m,re;
  re=new RegExp(NUMRE+'\\s*(CUP|CUC|MLC|USD|MN|pesos?)(?![A-Za-z])','gi');
  while((m=re.exec(t)))cands.push({i:m.index,n:m[1],c:m[2]});
  re=new RegExp('(CUP|CUC|MLC|USD|\\$)\\s*'+NUMRE,'gi');
  while((m=re.exec(t)))cands.push({i:m.index,n:m[2],c:m[1]});
  re=new RegExp('(?:monto|importe|valor|suma|por|recib\\w*|acredit\\w*)\\s*[:\\-]?\\s*\\$?\\s*'+NUMRE,'gi');
  while((m=re.exec(t)))cands.push({i:m.index,n:m[1],c:'CUP',weak:1});
  cands=cands.filter(function(c){return !/(saldo|disponible|balance|comisi|pagad)/i.test(t.slice(Math.max(0,c.i-14),c.i+2));});
  cands.sort(function(a,b){return (a.weak||0)-(b.weak||0)||a.i-b.i;});
  for(var k=0;k<cands.length;k++){var v=smsNum(cands[k].n);if(v>0){out.amount=r2(v);var c=String(cands[k].c).toUpperCase();out.cur=(c==='$'||c==='MN'||/^PESO/.test(c))?'CUP':c;break;}}
  var pm=t.match(new RegExp('pagad[oa]\\s*[:\\-]?\\s*\\$?\\s*'+NUMRE+'\\s*(CUP|CUC|MLC|USD|MN)?(?![A-Za-z])','i'));
  if(pm){var pv=smsNum(pm[1]);if(pv>0){if(out.amount){if(out.amount!==r2(pv))out.paid=r2(pv);}else{out.amount=r2(pv);var pc=(pm[2]||'CUP').toUpperCase();out.cur=pc==='MN'?'CUP':pc;}}}
  var rm=t.match(/(?:nro\.?|n[uú]mero|n[º°o]\.?|transacci[oó]n|trans\.?|ref(?:erencia)?\.?|c[oó]digo|operaci[oó]n|id)\s*(?:de\s+(?:transacci[oó]n|operaci[oó]n)\s*)?[:#\-]?\s*((?=[A-Za-z0-9-]*\d)[A-Za-z0-9-]{6,})/i);
  out.ref=rm?rm[1]:smsHash(t);
  out.sent=/(env[ií]aste|has enviado|realizaste|d[eé]bito|debitad|pagaste)/i.test(t)&&!/(recib|acredit|abon|te transfiri)/i.test(t);
  return out;
}
function smsDup(ref){
  var ids=Object.keys(S.sales);
  for(var i=0;i<ids.length;i++){var x=S.sales[ids[i]];if(x&&!x.del&&x.tref===ref)return x;}
  return null;
}
function smsRead(){
  var res=$('#sms-res');if(!res)return;
  var r=smsParse(val('p-sms'));ui.sms=null;
  if(!r.text){res.className='smsres';res.textContent='';return;}
  if(!r.amount){res.className='smsres bad';res.textContent='No encontré el monto. Escríbelo en Transfer. CUP.';return;}
  var d=smsDup(r.ref),nid=/^SMS-/.test(r.ref);
  if(d&&!nid){res.className='smsres bad';res.textContent='Este SMS ya se registró en una venta de las '+hhmm(d.ts)+'. No se vuelve a cobrar.';return;}
  if(r.sent){res.className='smsres bad';res.textContent='Parece una transferencia enviada, no recibida. Revísalo.';return;}
  if(r.cur!=='CUP'){res.className='smsres bad';res.textContent='Moneda detectada: '+r.cur+' ('+fmt(r.amount)+'). Escribe el monto a mano donde corresponda.';return;}
  r.ok=true;ui.sms=r;
  $('#p-tr').value=fmt2(r.amount);
  res.className='smsres ok';res.textContent='✔ '+fmt(r.amount)+' CUP detectado'+(r.paid?' (el cliente pagó '+fmt(r.paid)+' con descuento del banco)':'')+(nid?'':' · ref '+r.ref);
  if(d&&nid){res.className='smsres bad';res.textContent='⚠ '+fmt(r.amount)+' CUP detectado, pero ya hubo un SMS igual a las '+hhmm(d.ts)+' (sin número de operación). Si es otro pago, continúa.';}
  refreshTotals();
}

function confirmSale(){
  var lines=ui.cart.filter(function(l){return l.qty>0;});
  if(!lines.length)return;
  var total=r2(sum(lines,function(l){return l.qty*l.price;}));

    for(var i=0;i<lines.length;i++){if(lines[i].qty>stockOf(lines[i].pid)+1e-9){toast('Sin existencias suficientes de '+lines[i].name);return;}}
  }
  if(ui.sms&&ui.sms.ok&&tr>0&&!/^SMS-/.test(ui.sms.ref)&&smsDup(ui.sms.ref)){toast('Este SMS ya se registró en otra venta');return;}
  var ts=Date.now(),change=r2(Math.max(0,paid-total));
  var rec={id:uid(),ts:ts,day:dayKey(ts),items:lines.map(function(l){var p=S.products[l.pid];return Object.assign({pid:l.pid,name:l.name,qty:l.qty,price:l.price,cost:p?p.cost||0:0},l.pk?{pk:l.pk}:{});}),total:total,pay:{cup:cup,usd:usd,tr:tr},change:change,rate:S.settings.rate};
  if(ui.sms&&ui.sms.ok&&tr>0){rec.tref=ui.sms.ref;rec.tsms=ui.sms.text.slice(0,300);}
  var ordId=ui.orderId;ui.orderId=null;
  var ordPrev=ordId&&S.pedidos[ordId]&&S.pedidos[ordId].status==='nuevo'&&S.pedidos[ordId].items.every(function(it){return lines.some(function(l){return l.pid===it.pid&&l.qty>=it.qty-1e-9;});})?Object.assign({},S.pedidos[ordId]):null;
  if(ordPrev){rec.ped=ordPrev.code;rec.cliente=ordPrev.name;}
  var back=lines.map(function(l){return Object.assign({pid:l.pid,name:l.name,price:l.price,qty:l.qty},l.pk?{pk:l.pk}:{},l.unit==='kg'?{unit:'kg'}:{});});
  put('sales',rec);
  if(ordPrev)put('pedidos',Object.assign({},ordPrev,{status:'cobrado',saleId:rec.id,paidTs:ts}));
  ui.sms=null;ui.cart=[];ui.undo=[];closeModal();
  var warn=[];lines.forEach(function(l){var p=S.products[l.pid];if(p&&!p.del){var st=stockOf(p.id);if(st<=0)warn.push(p.name+' (agotado)');else if(st<=minOf(p))warn.push(lowTxt(p));}});
  toast('Venta registrada · Vuelto '+money(change)+(warn.length?' · ⚠ Poco stock: '+warn.slice(0,3).join(', ')+(warn.length>3?'…':''):''),'Deshacer',function(){
    var cur=S.sales[rec.id];if(!cur)return;
    put('sales',Object.assign({},cur,{del:true}));
    if(ordPrev)put('pedidos',ordPrev);
    ui.cart=back;ui.tab='caja';render();toast('Venta anulada. Carrito restaurado.');
  });
}

function hasHistory(p){return hasSales(p.id)||Object.keys(S.entries).some(function(k){return S.entries[k].pid===p.id&&!S.entries[k].del;});}
function isOut(p){return !p.del&&stockOf(p.id)<=0&&hasHistory(p);}
function lowLimit(){var n=S.settings.lowStock;return (n==null||isNaN(n))?3:n;}
function minOf(p){return p.min>0?p.min:lowLimit();}
function isLow(p){var st=stockOf(p.id);return !p.del&&!isOut(p)&&st>0&&st<=minOf(p);}
function lowList(){return products().filter(isLow).sort(function(a,b){return stockOf(a.id)-stockOf(b.id)||a.name.localeCompare(b.name,'es');});}
function UL(p){return p&&p.ul==='lb'?'lb':'kg';}
function lowTxt(p){var st=stockOf(p.id);return p.name+' ('+(st===1&&p.unit!=='kg'?'1 u.':fmtq(st)+(p.unit==='kg'?' '+UL(p):' u.'))+')';}

  var list=prods.filter(function(p){return !q||p.name.toLowerCase().indexOf(q)>-1||(p.cat||'').toLowerCase().indexOf(q)>-1;}).sort(function(a,b){return a.name.localeCompare(b.name,'es');});

  return h+agotadosHtml(out);

function saveProduct(id){
  var name=val('f-name').trim();if(!name){toast('Falta el nombre');return;}
  var c=num(val('f-cost')),cur=val('f-ccur')==='USD'?'USD':'CUP',cc=cur==='USD'?r2(c*rate()):c;
  var peg=!!$('#f-peg').checked,pusd=num(val('f-pusd')),price=num(val('f-price'));
  if(peg&&pusd<=0){toast('Indica el precio en USD para atarlo al dólar');return;}
  if(peg)price=roundUp(pusd*rate());
  var old=id?S.products[id]:null;
  var rec=Object.assign({},old||{},{id:id||uid(),name:name,cat:val('f-cat').trim(),price:price,cost:cc,ccur:cur,costUSD:cur==='USD'?c:0,margin:(num(val('f-margin'))===S.settings.margin?null:num(val('f-margin'))),peg:peg,priceUSD:peg?pusd:0,min:num(val('f-min')),unit:val('f-unit')==='u'?'u':'kg',ul:val('f-unit')==='lb'?'lb':null});
  var stCur=id?stockOf(id):0,stNew=(id&&val('f-stockcur')!=='')?num(val('f-stockcur')):stCur;

  put('products',rec);
  if(ui.photoTmp){var tmpPh=ui.photoTmp;ui.photoTmp=null;uploadPhoto(rec.id,tmpPh);}
  var synced=0;
  if(id&&cc>0&&openTs()===Infinity){Object.keys(S.entries).forEach(function(k){var e=S.entries[k];if(e.pid===id&&!e.del&&e.type==='inicial'&&Math.abs((e.cost||0)-cc)>1e-9){put('entries',Object.assign({},e,{cost:cc}));synced++;}});}
  if(id&&Math.abs(stNew-stCur)>1e-9)put('entries',{id:uid(),pid:id,qty:r3(stNew-stCur),type:'ajuste',cost:0,note:'Corrección de existencia',ts:Date.now()});
  if(!id){var st=num(val('f-stock'));if(st>0)put('entries',{id:uid(),pid:rec.id,qty:st,type:'inicial',cost:cc,note:'',ts:Date.now()});}
  var stale=[];
  if(id&&cc>0&&!synced){Object.keys(S.entries).forEach(function(k){var e=S.entries[k];if(e.pid===id&&!e.del&&e.type==='inicial'&&Math.abs((e.cost||0)-cc)>1e-9)stale.push(k);});}
  closeModal();

    var tot=0,tot2=0;stale.forEach(function(k){var e=S.entries[k];tot+=e.qty*(e.cost||0);tot2+=e.qty*cc;});
    ui.initFix={ids:stale,cost:cc};
    openModal('<h3>¿Actualizar la compra inicial?</h3><p>El costo del producto ahora es <b>'+fmt(cc)+'</b>, pero la compra inicial de «'+esc(name)+'» sigue guardada a otro costo. La inversión se calcula con el de la compra: pasaría de <b>'+money(r2(tot))+'</b> a <b>'+money(r2(tot2))+'</b>.</p><button class="btn primary big" data-act="init-fix">Sí, actualizar la compra inicial</button><button class="btn big" data-act="modal-close">No, dejarla como está</button>');
    toast('Producto guardado');return;
  }
  toast(synced?'Producto guardado. El costo de la compra inicial se actualizó a '+fmt(cc):'Producto guardado');
}

function packsOf(p){return (p&&p.unit!=='kg'&&Array.isArray(p.packs)?p.packs:[]).filter(function(k){return k&&k.n>=2;});}
function bundlePrice(p,k){return k.fix>0?k.fix:roundUp(k.n*priceOf(p)*(1-Math.min(Math.max(k.desc||0,0),90)/100));}
function r4(n){return Math.round(n*10000)/10000;}
function addUnit(p){
  var l=ui.cart.filter(function(x){return x.pid===p.id&&!x.pk&&x.unit!=='kg';})[0],nq=(l?l.qty:0)+1;
  var inCart=sum(ui.cart.filter(function(x){return x.pid===p.id;}),function(x){return x.qty;});
  if(!S.settings.allowNegative&&inCart+1>stockOf(p.id)+1e-9){toast('Sin existencias de '+p.name);return;}
  pushUndo();
  if(l)l.qty=nq;else ui.cart.push({pid:p.id,name:p.name,price:priceOf(p),qty:1});
  closeModal();render();
}
function addBundle(p,k){
  var inCart=sum(ui.cart.filter(function(x){return x.pid===p.id;}),function(x){return x.qty;});
  if(!S.settings.allowNegative&&inCart+k.n>stockOf(p.id)+1e-9){toast('No alcanza para otro '+k.name.toLowerCase()+' de '+p.name);return;}
  var bp=bundlePrice(p,k),pu=r4(bp/k.n);

  var l=ui.cart.filter(function(x){return x.pid===p.id&&x.pk===k.n&&Math.abs(x.price-pu)<0.00005;})[0];
  if(l)l.qty=r3(l.qty+k.n);else ui.cart.push({pid:p.id,name:p.name+' ('+k.name+' ×'+k.n+')',price:pu,qty:k.n,pk:k.n});

  '<div class="fg"><label>Los costos están en<select id="i-cur"><option value="CUP">CUP</option><option value="USD">USD</option></select></label><label>Atar precios al dólar<select id="i-peg"><option value="0">No</option><option value="1">Sí</option></select></label></div>'+

function runImport(){
  var lines=val('imp').split(/\r?\n/).map(function(l){return l.trim();}).filter(Boolean);
  if(!lines.length)return;
  var cur=val('i-cur')==='USD'?'USD':'CUP',peg=val('i-peg')==='1',m=S.settings.margin,n=0;
  lines.forEach(function(l){
    var sep=l.indexOf('\t')>-1?'\t':l.indexOf(';')>-1?';':',';
    var c=l.split(sep).map(function(x){return x.trim();});
    if(!c[0]||/^nombre$/i.test(c[0]))return;
    var cost=num(c[2]),cc=cur==='USD'?r2(cost*rate()):cost,price=num(c[3]);
    if(price<=0&&cc>0)price=sugg(cc,m);
    var pusd=peg&&price>0?r2(price/rate()):0,id=uid();
    put('products',{id:id,name:c[0],cat:c[1]||'',price:price,cost:cc,ccur:cur,costUSD:cur==='USD'?cost:0,margin:null,peg:pusd>0,priceUSD:pusd,min:num(c[5])});
    var st=num(c[4]);if(st>0)put('entries',{id:uid(),pid:id,qty:st,type:'inicial',cost:cc,note:'',ts:Date.now()});
    n++;
  });
  closeModal();toast(n+' productos importados');
}

function dayStats(day){
  var today=dayKey(Date.now());
  var sales=Object.keys(S.sales).map(function(k){return S.sales[k];}).filter(function(s){return !s.del&&s.day===day;}).sort(function(a,b){return b.ts-a.ts;});

function openTs(){var t=Infinity,k,x;for(k in S.sales){x=S.sales[k];if(!x.del&&x.ts<t)t=x.ts;}return t;}
function mercInicial(){var t=0,ar=0,n={},k,e,o=openTs(),c;for(k in S.entries){e=S.entries[k];if(e.del)continue;if(e.type==='inicial'||(e.type==='entrada'&&e.ts<o)){c=e.qty*(e.cost||0);t+=c;n[e.pid]=1;if(S.products[e.pid]&&S.products[e.pid].del)ar+=c;}}return {total:r2(t),n:Object.keys(n).length,arch:r2(ar)};}

  var days={},k;
  for(k in S.sales){if(!S.sales[k].del)days[S.sales[k].day]=1;}
  for(k in S.expenses){if(!S.expenses[k].del)days[S.expenses[k].day]=1;}

function pedList(){return Object.keys(S.pedidos).map(function(k){return S.pedidos[k];}).filter(function(p){return !p.del;});}

function waDigits(ph){var d=String(ph||'').replace(/\D/g,'');if(d.length===8&&d[0]==='5')d='53'+d;return d;}
function phoneTxt(ph){var d=waDigits(ph);return d.length>8&&d.slice(0,2)==='53'?'+53 '+d.slice(2):'+'+d;}
function pedLeft(p){var m=Math.round((p.exp-Date.now())/60000);if(m<=0)return 'vencido';return 'reservado '+(m>=60?Math.floor(m/60)+' h '+(m%60)+' min':m+' min');}

function resizeImg(file,max,q,cb){
  var url=URL.createObjectURL(file),im=new Image();
  im.onload=function(){var w=im.naturalWidth,h=im.naturalHeight,k=Math.min(1,max/Math.max(w,h)),cw=Math.max(1,Math.round(w*k)),ch=Math.max(1,Math.round(h*k));
    var c=document.createElement('canvas');c.width=cw;c.height=ch;var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cw,ch);x.drawImage(im,0,0,cw,ch);
    c.toBlob(function(b){URL.revokeObjectURL(url);cb(b);},'image/jpeg',q);};
  im.onerror=function(){URL.revokeObjectURL(url);cb(null);};im.src=url;
}
function photoPick(inp){
  var f=inp.files&&inp.files[0];if(!f)return;
  resizeImg(f,640,0.72,function(full){
    if(!full){toast('No se pudo leer esa foto');return;}
    resizeImg(f,240,0.7,function(th){
      if(!th){toast('No se pudo leer esa foto');return;}
      ui.photoTmp={full:full,thumb:th};
      var pv=$('#ph-prev');if(pv)pv.innerHTML='<img src="'+URL.createObjectURL(th)+'" alt="">';
      toast('Foto lista. Toca Guardar para subirla.');
    });
  });
}
async function photoReq(method,path,blob){
  var tk=await sbToken();if(!tk)throw new Error('auth');
  var h={apikey:SB.key,Authorization:'Bearer '+tk};if(blob){h['x-upsert']='true';h['Content-Type']='image/jpeg';}
  var r=await fetch(SB.url+'/storage/v1/object/fotos/'+path,{method:method,headers:h,body:blob||undefined});
  if(!r.ok)throw new Error('foto '+r.status);
}

function restore(file){
  var fr=new FileReader();
  fr.onload=function(){
    try{
      var o=JSON.parse(fr.result),n=0;
      ['products','sales','entries','expenses','invest','pedidos'].forEach(function(c){var m=o[c]||{};Object.keys(m).forEach(function(id){if(merge(c,m[id])){S.dirty[c+'/'+id]=1;n++;}});});
      if(o.settings&&merge('config',o.settings)){S.dirty['config/main']=1;n++;}
      persist();scheduleFlush();render();toast(n+' registros restaurados');
    }catch(e){toast('Archivo no válido');}
  };
  fr.readAsText(file);
}

function doReprice(){
  var n=0;
  products().forEach(function(p){
    if(p.peg)return;
    var base=p.ccur==='USD'&&p.costUSD>0?r2(p.costUSD*rate()):p.cost;
    if(!(base>0))return;
    var np=sugg(base,margOf(p));
    if(np!==p.price){put('products',Object.assign({},p,{price:np}));n++;}
  });
  return n;
}

      ch.shopOn=!!$('#s-shop').checked;ch.wa=waDigits(val('s-wa'));ch.holdH=Math.min(168,Math.max(1,num(val('s-hold'))||24));ch.shopNote=val('s-snote').trim().slice(0,200);
      if(ch.shopOn&&ch.wa.length<8){toast('Escribe tu WhatsApp para abrir la tienda');return;}
    }
    saveSettings(ch);
    var cnt=products().filter(function(p){return !p.peg&&p.cost>0;}).length;
    if((ch.margin!==old.margin||ch.round!==old.round)&&cnt){
      openModal('<h3>Margen actualizado</h3><p class="help" style="font-size:14px">¿Recalcular ahora los precios de '+cnt+' productos con el margen de '+fmt(ch.margin)+'% (redondeo a '+fmt(ch.round)+')? Los precios atados al dólar no cambian y los productos con margen propio usan el suyo.</p><button class="btn primary big" data-act="reprice-now">Recalcular precios</button><div class="btns"><button class="btn" data-act="close">Más tarde</button></div>');
    }else toast('Ajustes guardados');
  },
  'sync-now':function(){if(!DB)return;flush();toast('Sincronizando…');},
  'backup-dl':function(){download('respaldo-mercado-'+dayKey(Date.now())+'.json',backupText(),'application/json');},
  'backup-copy':function(){copyText(backupText());},
  'shop-copy':function(){copyText(shopUrl());},
  'shop-share':function(){window.open('https://wa.me/?text='+encodeURIComponent('Haz tu pedido en '+(S.settings.name||'nuestra tienda')+': '+shopUrl()),'_blank');},
  'ped-wa':function(t){var p=S.pedidos[t.dataset.id];if(p)window.open(pedWa(p),'_blank');},
  'ped-pay':function(t){
    var p=S.pedidos[t.dataset.id];if(!p)return;var miss=[];
    var cart=p.items.map(function(l){var pr=S.products[l.pid];if(!pr||pr.del||(!S.settings.allowNegative&&stockOf(l.pid)<l.qty-1e-9))miss.push(l.name);return {pid:l.pid,name:l.pk?l.name+' ('+(l.pname||'Paquete')+' ×'+l.pk+')':l.name+(l.unit==='kg'?' ('+UL(S.products[l.pid])+')':''),price:l.qty>0?r4(l.sub/l.qty):l.price,qty:l.qty,unit:l.unit==='kg'?'kg':undefined,pk:l.pk||undefined};});
    if(miss.length){toast('No alcanza la mercancía de: '+miss.join(', '));return;}
    ui.cart=cart;ui.undo=[];ui.orderId=p.id;ui.tab='caja';closeModal();render();openCart();
  },
  'ped-cancel':function(t){
    if(!armed(t,'¿Seguro? Toca otra vez'))return;
    var p=S.pedidos[t.dataset.id];if(!p)return;var prev=Object.assign({},p);
    put('pedidos',Object.assign({},p,{status:'cancelado'}));
    toast('Pedido '+p.code+' cancelado. La mercancía quedó libre.','Deshacer',function(){put('pedidos',prev);toast('Pedido restaurado');});
  },
  'photo-del':function(t){
    var id=t.dataset.id,p=S.products[id];if(!p)return;
    photoReq('DELETE','p/'+id+'.jpg').catch(function(){});photoReq('DELETE','t/'+id+'.jpg').catch(function(){});
    put('products',Object.assign({},p,{ph:0}));closeModal();toast('Foto quitada');
  },
  'csv-dl':function(){download('ventas-'+dayKey(Date.now())+'.csv',salesCSV(),'text/csv');},
  'csv-copy':function(){copyText(salesCSV());},
  'sb-show-setup':function(){lk={step:'setup',err:'',busy:false};renderLock();},
  'sb-show-login':function(){lk={step:'login',err:'',busy:false};renderLock();},
  'sb-login':function(){
    var em=val('lk-email').trim().toLowerCase(),pw=val('lk-pw');
    if(!em||!pw){lk.err='Escribe tu correo y contraseña';renderLock();return;}
    lk={step:'login',err:'',busy:true,email:em};renderLock();
    sbLogin(em,pw).then(function(){lk={step:'login',err:'',busy:false};ui.tab='caja';sbStart();render();}).catch(function(e){lk={step:'login',err:(e&&e.status===400)?'Correo o contraseña incorrectos':(e&&e.status?e.message:'No hay conexión con el servidor'),busy:false,email:em};renderLock();});
  },
  'sb-setup':function(){
    var em=val('lk-email').trim().toLowerCase(),pw=val('lk-pw'),code=val('lk-code').trim();
    if(!em||!pw||!code){lk.err='Completa los tres campos';renderLock();return;}
    lk={step:'setup',err:'',busy:true,email:em};renderLock();
    sbFn({action:'setup',email:em,password:pw,code:code},false).then(function(){return sbLogin(em,pw);}).then(function(){lk={step:'login',err:'',busy:false};ui.tab='caja';sbStart();render();}).catch(function(e){lk={step:'setup',err:e.message||'No se pudo crear',busy:false,email:em};renderLock();});
  },
  'user-new':function(){openModal('<h3>Agregar usuario</h3><label>Correo<input id="u-email" type="email" autocomplete="off"></label><label>Contraseña (mínimo 8)<input id="u-pw" type="text" autocomplete="off"></label><label>Rol<select id="u-role"><option value="seller">Vendedor (Caja y Cierre)</option><option value="admin">Administrador (todo)</option></select></label><button class="btn primary big" data-act="user-create">Crear usuario</button><div class="btns"><button class="btn" data-act="close">Cancelar</button></div>');},
  'user-create':function(){
    var em=val('u-email').trim(),pw=val('u-pw'),ro=val('u-role');
    sbFn({action:'create',email:em,password:pw,role:ro},true).then(function(){closeModal();toast('Usuario creado');sbUsers=null;render();}).catch(function(e){toast(e.message||'No se pudo crear');});
  },
  'user-pass':function(el){openModal('<h3>Nueva contraseña</h3><p class="help">'+esc(el.dataset.email)+'</p><label>Contraseña (mínimo 8)<input id="u-pw" type="text" autocomplete="off"></label><button class="btn primary big" data-act="user-pass-save" data-id="'+esc(el.dataset.id)+'">Guardar</button><div class="btns"><button class="btn" data-act="close">Cancelar</button></div>');},
  'user-pass-save':function(el){sbFn({action:'setpass',user_id:el.dataset.id,password:val('u-pw')},true).then(function(){closeModal();toast('Contraseña cambiada');}).catch(function(e){toast(e.message||'No se pudo cambiar');});},
  'user-del':function(el){openModal('<h3>Quitar usuario</h3><p class="help">'+esc(el.dataset.email)+' ya no podrá entrar. Sus ventas se conservan.</p><button class="btn primary big" data-act="user-del-yes" data-id="'+esc(el.dataset.id)+'">Quitar usuario</button><div class="btns"><button class="btn" data-act="close">Cancelar</button></div>');},
  'user-del-yes':function(el){sbFn({action:'remove',user_id:el.dataset.id},true).then(function(){closeModal();toast('Usuario quitado');sbUsers=null;render();}).catch(function(e){toast(e.message||'No se pudo quitar');});},
  'lock-role':function(el){var r=el.dataset.r==='admin'?'admin':'seller';if(r==='seller'&&!S.settings.pinV){setRole('seller');return;}lk={step:'pin',r:r,err:''};renderLock();},
  'lock-enter':function(){var p=val('lk-pin').trim(),want=lk.r==='admin'?S.settings.pinA:S.settings.pinV;if(p&&hp(p)===want){setRole(lk.r);}else{lk.err='PIN incorrecto';renderLock();}},
  'lock-back':function(){lk={step:'role',r:null,err:''};renderLock();},
  'logout':function(){if(sbOn()){sbLogout();return;}setRole(null);},
  'pin-save':function(){
    var a=val('a-pin').trim(),v=val('v-pin').trim(),ch={};
    if(a&&!/^\d{4,8}$/.test(a)){toast('El PIN del administrador debe tener de 4 a 8 números');return;}
    if(v&&!/^\d{4,8}$/.test(v)){toast('El PIN del vendedor debe tener de 4 a 8 números');return;}
    if(a)ch.pinA=hp(a);if(v)ch.pinV=hp(v);
    if(!a&&!v){toast('Escribe un PIN');return;}
    if(!a&&!S.settings.pinA){toast('Primero define el PIN del administrador');return;}
    saveSettings(ch);if(a){ROLE='admin';try{sessionStorage.setItem(ROLEK,'admin');}catch(e){}}
    toast('PIN guardado');render();
  },
  'pin-clear':function(){saveSettings({pinA:'',pinV:''});ROLE=null;try{sessionStorage.removeItem(ROLEK);}catch(e){}toast('Bloqueo quitado');render();},
'theme-set':function(el){var t=el.dataset.t==='dark'?'dark':'light';applyTheme(t);try{localStorage.setItem(THK,t);}catch(e){}render();},
    'setup-save':function(){var r=num(val('w-rate'));if(r<=0){toast('Indica la tasa');return;}saveSettings({name:val('w-name').trim()||'Alfonsos',rate:r});closeModal();}
};
function fmt2(n){return String(r2(n));}
document.addEventListener('click',function(e){
  if(e.target.classList&&e.target.classList.contains('scrim')){closeModal();return;}
  var t=e.target.closest?e.target.closest('[data-act]'):null;if(!t)return;
  var f=H[t.dataset.act];if(f)f(t,e);
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='q'){ui.q=t.value;render();}
  else if(t.id==='invq'){ui.invQ=t.value;render();}
  else if(t.classList.contains('lq')||t.classList.contains('lp')){
    var l=ui.cart[+t.dataset.i];if(!l)return;
    if(t.classList.contains('lq'))l.qty=num(t.value);else l.price=num(t.value);
    refreshTotals();
  }
  else if(t.id==='p-sms')smsRead();
  else if(t.id==='e-sacks'||t.id==='e-kgs'||t.id==='e-sackcost')sackCalc();
  else if(t.id==='w-g')updateW();
  else if(t.id==='e-pkcnt'||t.id==='e-pkcost')pkEntryCalc();
  else if(t.id&&t.id.indexOf('f-pk')===0||t.id==='f-price')pkPrev();
  else if(t.id==='rp-tot')repayFill('tot');
  else if(t.id&&t.id.indexOf('rp-u-')===0)repayFill('line');
  else if(t.id==='p-cup'||t.id==='p-usd'||t.id==='p-tr')refreshTotals();
  else if(t.id==='v-amt'||t.id==='v-cur'||t.id==='v-rate')updateAp();
  else if(t.id==='g-amt'||t.id==='g-cur'||t.id==='g-rate')updateGa();
  else if(t.id==='f-cost'||t.id==='f-ccur'||t.id==='f-margin')updateSugg();
  else if(t.id==='f-price')updateSugg('price');
  else if(t.id==='f-pusd')updateSugg('pusd');
  else if(t.id==='e-cost'||t.id==='e-ccur')updateEsug();
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='dayin'&&t.value){ui.day=t.value;render();}
  else if(t.id==='rp-from')openRepay(t.value,val('rp-to'),'');
  else if(t.id&&t.id.indexOf('rp-c-')===0)repayFill('tot');
  else if(t.id==='restorefile'&&t.files&&t.files[0])restore(t.files[0]);
  else if(t.id==='f-photo')photoPick(t);
});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal();});
window.addEventListener('online',function(){flush();});
setInterval(function(){if(DB&&dirtyCount())flush();},20000);

/* ---------- arranque ---------- */
function applySeed(){
  ['products','sales','entries','expenses','invest'].forEach(function(c){var m=SEED[c]||{};Object.keys(m).forEach(function(id){merge(c,m[id]);});});
  if(SEED.settings)S.settings=Object.assign({},DEF,SEED.settings);
  persist();
}
load();
if(SEED&&!window.claude&&!products().length&&!S.settings.u)applySeed();
doRender();
if(sbOn()){sbStart();}else{
if(!window.claude)maybeSetup();
initCloud().then(function(){if(!DB)maybeSetup();});
}
})();
</script>
